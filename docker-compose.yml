name: bnp-decision-guard

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bnp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bnp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bnp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bnp_decision_guard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bnp} -d ${POSTGRES_DB:-bnp_decision_guard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO is pulled from quay.io, not Docker Hub. `minio/minio` and `minio/mc`
  # were withdrawn from Docker Hub — both now return 404 on the repository API
  # and 401 on an anonymous manifest fetch, while `pgvector/pgvector` beside
  # them returns 200 — so `docker compose up` and CI's browser smoke both died
  # at image resolution, before a container existed:
  #   minio Error pull access denied for minio/minio, repository does not exist
  # quay.io/minio/minio is MinIO's own alternative registry, so this is a
  # registry change and not a change of software.
  minio:
    image: quay.io/minio/minio:latest
    container_name: bnp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bnp_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-bnp_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # Deliberately no healthcheck. The previous one shelled out to `mc` inside
    # this image, which ties liveness to a binary the image is not obliged to
    # ship; the API's own /health/ready already probes object storage
    # (health.controller.ts:41 -> storage.service.ts:45), and it is the `api`
    # healthcheck that gates `web` below.

  # `minio-init` is gone, not replaced. Its only job was `mc mb`, and
  # StorageService.ensureBucket() (storage.service.ts:53-64) already creates the
  # bucket on demand — it is called from documents.service.ts:82 on every upload
  # and from seed.ts:160 on boot when SEED_ON_BOOT is true, which is the
  # default. A second service pulling a second withdrawn image to do work the
  # application already does was one more thing to break.

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: bnp-api
    depends_on:
      postgres:
        condition: service_healthy
      # service_started, not service_healthy: minio has no healthcheck now (see
      # above). The API tolerates object storage arriving late — ensureBucket is
      # lazy and /health/ready reports `objectStorage: down` with a 503 until it
      # is reachable, which is what the 60s start_period below is for.
      minio:
        condition: service_started
    environment:
      # This file is the local demo stack, and it ships the shipped-default
      # secrets below. NODE_ENV=production here made the API's secret
      # fail-fast refuse to boot, so `docker compose up --build` — the
      # documented quickstart — never started. Point a real deployment at the
      # k8s manifests (or override every secret) rather than flipping this.
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      # Without this the API allows no browser origin and the web app on :3000
      # is silently blocked from calling it.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bnp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bnp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bnp_decision_guard}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too-in-production}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bnp_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bnp_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-bnp-documents}
      S3_FORCE_PATH_STYLE: "true"
      # Demo default logs the reset link instead of sending it. Point this at
      # a relay (MAIL_PROVIDER=smtp + MAIL_HOST) to exercise real delivery.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: ${MAIL_FROM:-BNP Decision Guard <no-reply@bnp.health>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_FINAL_K: ${RAG_FINAL_K:-4}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.25}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    ports:
      - "4000:4000"
    # No curl/wget assumption on the alpine runtime image — node's own http
    # client is always present. start_period covers migrate+seed running
    # before the server even starts listening (SEED_ON_BOOT default is true).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: bnp-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
