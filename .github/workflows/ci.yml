name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hard gate: a new critical vulnerability fails the build immediately.
      - name: Fail on critical vulnerabilities
        run: npm audit --audit-level=critical
      # Soft gate: high/moderate findings are surfaced but do not block merges,
      # since some remaining items (see docs/production-readiness.md) are only
      # fixable by a NestJS 11 / Next.js 15 major-version migration.
      - name: Report high/moderate vulnerabilities (non-blocking)
        if: always()
        run: npm audit --audit-level=high || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @bnp/shared must be built first: api and web import it from its
      # compiled dist/, and typescript-eslint resolves those imports.
      - run: npm run build:shared
      # Errors fail the build; the remaining `any` warnings are documented in
      # eslint.config.js and deliberately non-blocking.
      - run: npm run lint

  api:
    name: API — build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bnp
          POSTGRES_PASSWORD: bnp_secret
          POSTGRES_DB: bnp_decision_guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bnp -d bnp_decision_guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: bnp
      POSTGRES_PASSWORD: bnp_secret
      POSTGRES_DB: bnp_decision_guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npm run build:shared
      - name: Build API
        run: npm run build -w @bnp/api
      - name: Unit tests
        run: npm test -w @bnp/api
      - name: Run migrations against Postgres
        run: node apps/api/dist/scripts/migrate.js
      # Uses the `pg` client already in the dependency tree rather than
      # assuming psql is on the runner image.
      - name: Create integration-test database
        run: |
          node -e "
          const { Client } = require('pg');
          (async () => {
            const c = new Client({ host: 'localhost', user: 'bnp', password: 'bnp_secret', database: 'postgres' });
            await c.connect();
            await c.query('CREATE DATABASE bnp_e2e').catch((e) => {
              if (!/already exists/.test(e.message)) throw e;
            });
            await c.end();
          })();
          "
      # Real HTTP through the real Nest wiring against real Postgres+pgvector:
      # the guards, pipes and exception filter the unit suite has to mock away.
      - name: Integration tests
        run: npm run test:e2e -w @bnp/api
        env:
          E2E_POSTGRES_HOST: localhost
          E2E_POSTGRES_PORT: 5432
          E2E_POSTGRES_USER: bnp
          E2E_POSTGRES_PASSWORD: bnp_secret
          E2E_POSTGRES_DB: bnp_e2e

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Build web
        run: npm run build -w @bnp/web

  smoke:
    name: Browser smoke — full stack via Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Brings up postgres + minio + api + web exactly as the README's
      # quickstart does. This doubles as a regression test for that quickstart:
      # compose previously set NODE_ENV=production against the shipped default
      # secrets, so `docker compose up --build` crash-looped on a clean clone
      # and nothing in CI noticed.
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health > /dev/null; then
              echo "API healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy in time"; docker compose logs api; exit 1
      - name: Wait for the web app
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/login > /dev/null; then
              echo "Web up after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "Web did not come up in time"; docker compose logs web; exit 1
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx --yes playwright install --with-deps chromium
      # Drives login -> cited answer -> refusal -> dose calculation ->
      # copy-protection -> role-aware navigation -> language switching and RTL
      # mirroring -> responsive breakpoints -> search/filtering -> the user
      # lifecycle -> audit filtering, against the running stack. See README.
      - name: Run browser smoke
        run: node apps/web/e2e-smoke.mjs
        env:
          E2E_SHOTS: ${{ github.workspace }}/e2e-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  mobile:
    name: Mobile — typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # apps/mobile is deliberately not an npm workspace (Expo/Metro resolve
      # hoisted dependencies badly), so it installs on its own.
      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit
      # Session storage, refresh-on-401 and the bilingual helpers — the parts
      # of the mobile app that carry security and clinical consequences and
      # that a typecheck alone says nothing about.
      - name: Unit tests
        working-directory: apps/mobile
        run: npm test
      # The root `security` job's audit cannot see this tree — apps/mobile is
      # not an npm workspace — so it is scanned here. Gated at critical,
      # matching the root job, since the Expo SDK 57 upgrade made fixes
      # reachable in-band. Known accepted floor: image-size's two high
      # advisories are vulnerable at every published version (<=2.0.2 ==
      # latest), sit in Metro's build-time asset pipeline, and this app has no
      # image assets — the high-level report below keeps them visible until a
      # fixed release exists.
      - name: Fail on critical mobile vulnerabilities
        working-directory: apps/mobile
        run: npm audit --audit-level=critical
      - name: Report high/moderate mobile vulnerabilities (non-blocking)
        if: always()
        working-directory: apps/mobile
        run: npm audit --audit-level=high || true
