apiVersion: apps/v1
kind: Deployment
metadata:
  name: bnp-api
  labels: { app: bnp-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: bnp-api }
  template:
    metadata:
      labels: { app: bnp-api }
    spec:
      containers:
        - name: api
          image: bnp-decision-guard/api:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - secretRef: { name: bnp-secrets }
          env:
            # Required. Without it the API runs in development mode: the secret
            # fail-fast never engages and 5xx internals leak to clients.
            - { name: NODE_ENV, value: "production" }
            - { name: API_PORT, value: "4000" }
            # Required. An empty allowlist blocks every cross-origin browser
            # call, so the web app cannot reach the API. Set your real origin.
            - { name: CORS_ORIGINS, value: "https://your-web-origin.example" }
            # "log" only writes reset links to the application log, where
            # anyone with log access can read them. Use "smtp" for real users;
            # MAIL_HOST and credentials come from the Secret.
            - { name: MAIL_PROVIDER, value: "smtp" }
            - { name: MAIL_FROM, value: "BNP Decision Guard <no-reply@your-hospital.example>" }
            # Public web origin — the reset link is built from it. Defaults to
            # the first CORS_ORIGINS entry if unset.
            - { name: APP_BASE_URL, value: "https://your-web-origin.example" }
            - { name: LLM_PROVIDER, value: "mock" }
            - { name: EMBEDDING_PROVIDER, value: "mock" }
            - { name: S3_FORCE_PATH_STYLE, value: "true" }
            - { name: SEED_ON_BOOT, value: "false" }
          # /health/ready checks Postgres and object storage — a pod that
          # can't reach either is pulled from the Service's load-balancing
          # rotation without being killed.
          readinessProbe:
            httpGet: { path: /health/ready, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # /health is a cheap liveness signal only (no dependency checks): a
          # readiness-style DB/S3 check here would make Kubernetes restart
          # healthy pods during a Postgres blip, turning a brief outage into a
          # restart storm instead of just draining traffic from the pod.
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: bnp-api
spec:
  selector: { app: bnp-api }
  ports:
    - port: 80
      targetPort: 4000
