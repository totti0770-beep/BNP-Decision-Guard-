apiVersion: v1
kind: Secret
metadata:
  name: bnp-secrets
type: Opaque
stringData:
  POSTGRES_HOST: "your-postgres-host"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "bnp"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "bnp_decision_guard"
  JWT_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  S3_ENDPOINT: "https://your-s3-endpoint"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  S3_BUCKET: "bnp-documents"
  OPENAI_API_KEY: ""
  # Required when MAIL_PROVIDER=smtp (see api-deployment.yaml). Leave
  # SMTP_USER/SMTP_PASSWORD empty for an unauthenticated internal relay.
  SMTP_HOST: "smtp.your-hospital.example"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
