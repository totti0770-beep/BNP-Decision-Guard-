apiVersion: v1
kind: Secret
metadata:
  name: bnp-secrets
type: Opaque
stringData:
  POSTGRES_HOST: "your-postgres-host"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "bnp"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "bnp_decision_guard"
  JWT_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  S3_ENDPOINT: "https://your-s3-endpoint"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  S3_BUCKET: "bnp-documents"
  # Required: api-deployment.yaml selects the openai provider for both the LLM
  # and embeddings, and the API refuses to boot with either set to "openai" and
  # this blank. Leave it empty only if you also set both providers to "mock".
  OPENAI_API_KEY: "REPLACE_ME"
  # Required when MAIL_PROVIDER=smtp (see api-deployment.yaml). Leave
  # MAIL_USER/MAIL_PASSWORD empty for an unauthenticated internal relay.
  MAIL_HOST: "smtp.your-hospital.example"
  MAIL_PORT: "587"
  MAIL_USER: ""
  MAIL_PASSWORD: ""
